name: "Build and Test"
description: "Build and Test"
runs:
  using: "composite"
  steps:
    - name: Build Firefox v2
      shell: bash
      run: npm run build:firefox_v2
    - name: Build Firefox v3
      shell: bash
      run: npm run build:firefox_v3
    - name: Build Chrome v2
      shell: bash
      run: npm run build:chrome_v2
    - name: Build Chrome v3
      shell: bash
      run: npm run build:chrome_v3
    - name: Upload bundle
      uses: actions/upload-artifact@v7
      with:
        name: dist
        retention-days: 7
        path: |
          dist_chrome_v2
          dist_chrome_v3
          dist_firefox_v2
          dist_firefox_v3
    - name: Install Puppeteer Browsers
      shell: bash
      env:
        PUPPETEER_CHROME_SKIP_DOWNLOAD: false
        PUPPETEER_FIREFOX_SKIP_DOWNLOAD: false
        PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: false
      run: npx puppeteer browsers install
    - name: Install Edge
      id: install-edge
      shell: bash
      run: |
        sudo rm -f /var/lib/dpkg/info/man-db.*
        sudo rm -f /var/lib/dpkg/triggers/*man-db*
        sudo apt-get remove -y microsoft-edge-stable
        wget https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_151.0.4129.72-1_amd64.deb -nv -O ./temp/microsoft-edge-stable.deb
        sudo dpkg -i ./temp/microsoft-edge-stable.deb
        microsoft-edge --version
        EDGE_PATH=$(which microsoft-edge)
        echo "edge-path=$EDGE_PATH" >> $GITHUB_OUTPUT
    - name: Test
      shell: bash
      env:
        EDGE_PATH: ${{ steps.install-edge.outputs.edge-path }}
      run: |
        php -S 0.0.0.0:8899 -t $GITHUB_WORKSPACE/tests/simple-server > /dev/null 2>&1 &
        sleep 2
        npm run test:e2e
